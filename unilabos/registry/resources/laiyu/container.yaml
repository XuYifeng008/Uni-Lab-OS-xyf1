bottle_container:
  category:
  - resource_container
  - container
  - consumable
  class:
    module: unilabos.devices.resource_container.container:BottleRackContainer
    type: python
  description: 来煜瓶架/GreenLab加样口容器，支持按孔位初始化液体
  handles: []
  icon: ''
  init_param_schema:
    properties:
      liquid_input_slot:
        description: 需要初始化液体的孔位索引列表，-1 表示容器自身
        items:
          type: integer
        type: array
      liquid_type:
        description: 与 liquid_input_slot 对应的液体类型列表
        items:
          type: string
        type: array
      liquid_volume:
        description: 与 liquid_input_slot 对应的液体体积列表，单位 uL
        items:
          type: number
        type: array
    required: []
    type: object
  model:
    children_mesh: bottle/meshes/bottle.stl
    children_mesh_path: https://leap-lab.oss-cn-zhangjiakou.aliyuncs.com/uni-lab/resources/bottle/modal.xacro
    children_mesh_tf:
    - 0.04
    - 0.04
    - 0
    - 0
    - 0
    - 0
    mesh: bottle_container/meshes/bottle_container.stl
    mesh_tf:
    - 0
    - 0
    - 0
    - 0
    - 0
    - 0
    path: https://leap-lab.oss-cn-zhangjiakou.aliyuncs.com/uni-lab/resources/bottle_container/modal.xacro
    type: resource
  version: 1.0.0

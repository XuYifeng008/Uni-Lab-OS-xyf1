# GreenLab 电反应仪设备注册表
# 支持6通道电化学反应控制，通过Modbus RTU通信

greenlab_electrochemical:
  class:
    module: unilabos.devices.GreenLab.greenlab_electrochemical:GreenLabElectrochemical
    status_types:
      status: str
      is_connected: bool
    action_value_mappings:
      set_reaction_parameters:
        type: UniLabJsonCommand
        goal:
          channel: channel
          mode: mode
          voltage: voltage
          current: current
          stirrer_speed: stirrer_speed
          alternate_mode: alternate_mode
          low_freq_time: low_freq_time
          high_freq_time: high_freq_time
        feedback: {}
        result: {}
        goal_default:
          channel: 1
          mode: 0
          voltage: 0.0
          current: 0.0
          stirrer_speed: 0
          alternate_mode: 0
          low_freq_time: 0
          high_freq_time: 0
        handles: {}
        placeholder_keys: {}
        schema:
          description: "参数设置：写入指定通道的输出模式、电压/电流、交替模式和搅拌转速，但不打开反应通道"
          properties:
            feedback: {}
            goal:
              properties:
                channel:
                  type: integer
                  title: "位置号"
                  description: "台面位置号 1-6，对应电通道 3,4,5,6,1,2"
                  minimum: 1
                  maximum: 6
                  default: 1
                mode:
                  type: integer
                  title: "输出模式"
                  description: "0=恒压，1=恒流"
                  enum: [0, 1]
                  default: 0
                voltage:
                  type: number
                  title: "电压(V)"
                  description: "恒压模式下的目标电压，范围 0-30V"
                  minimum: 0
                  maximum: 30
                  default: 0.0
                current:
                  type: number
                  title: "电流(mA)"
                  description: "恒流模式下的目标电流，范围 0-100mA"
                  minimum: 0
                  maximum: 100
                  default: 0.0
                stirrer_speed:
                  type: integer
                  title: "搅拌转速(rpm)"
                  description: "0 表示不设置搅拌，非 0 时范围 200-1000rpm"
                  default: 0
                alternate_mode:
                  type: integer
                  title: "交替模式"
                  description: "0=无交替，1=低频交替，2=高频交替"
                  enum: [0, 1, 2]
                  default: 0
                low_freq_time:
                  type: integer
                  title: "低频交替时间(s)"
                  description: "低频交替时间，范围 1-6000s"
                  default: 0
                high_freq_time:
                  type: integer
                  title: "高频交替时间(ms)"
                  description: "高频交替时间，范围 5-1000ms"
                  default: 0
              required:
                - channel
              type: object
            result:
              type: object
          required:
            - goal
          title: "参数设置"
          type: object
      start_reaction:
        type: UniLabJsonCommand
        goal:
          channel: channel
          mode: mode
          voltage: voltage
          current: current
          stirrer_speed: stirrer_speed
        feedback: {}
        result: {}
        goal_default:
          channel: 1
          mode: null
          voltage: null
          current: null
          stirrer_speed: null
        handles: {}
        placeholder_keys: {}
        schema:
          description: "开始反应：打开指定通道；未传 mode 时使用参数设置节点保存的参数"
          properties:
            feedback: {}
            goal:
              properties:
                channel:
                  type: integer
                  title: "位置号"
                  description: "台面位置号 1-6，对应电通道 3,4,5,6,1,2"
                  minimum: 1
                  maximum: 6
                  default: 1
                mode:
                  type:
                    - integer
                    - "null"
                  title: "输出模式"
                  description: "0=恒压，1=恒流；为空时使用已设置参数"
                  enum: [0, 1, null]
                  default: null
                voltage:
                  type:
                    - number
                    - "null"
                  title: "电压(V)"
                  description: "恒压模式下的目标电压；为空时使用已设置参数"
                  minimum: 0
                  maximum: 30
                  default: null
                current:
                  type:
                    - number
                    - "null"
                  title: "电流(mA)"
                  description: "恒流模式下的目标电流；为空时使用已设置参数"
                  minimum: 0
                  maximum: 100
                  default: null
                stirrer_speed:
                  type:
                    - integer
                    - "null"
                  title: "搅拌转速(rpm)"
                  description: "0 表示不启动搅拌；为空时使用已设置参数"
                  default: null
              required:
                - channel
              type: object
            result:
              type: object
          required:
            - goal
          title: "开始反应"
          type: object
      end_reaction:
        type: UniLabJsonCommand
        goal:
          channel: channel
          stop_stirrer: stop_stirrer
        feedback: {}
        result: {}
        goal_default:
          channel: 1
          stop_stirrer: true
        handles: {}
        placeholder_keys: {}
        schema:
          description: "结束反应：关闭指定位置对应电通道，并可同时停止搅拌"
          properties:
            feedback: {}
            goal:
              properties:
                channel:
                  type: integer
                  title: "位置号"
                  description: "台面位置号 1-6，对应电通道 3,4,5,6,1,2"
                  minimum: 1
                  maximum: 6
                  default: 1
                stop_stirrer:
                  type: boolean
                  title: "停止搅拌"
                  description: "是否同时停止搅拌"
                  default: true
              required:
                - channel
              type: object
            result:
              type: object
          required:
            - goal
          title: "结束反应"
          type: object
      delay:
        type: UniLabJsonCommand
        goal:
          time: time
        feedback: {}
        result: {}
        goal_default:
          time: 0
        handles: {}
        placeholder_keys: {}
        schema:
          description: "延时节点：工作流在此节点停留指定秒数后继续执行下一节点"
          properties:
            feedback: {}
            goal:
              properties:
                time:
                  type: number
                  title: "延时时间(s)"
                  description: "工作流在此节点停留的秒数"
                  minimum: 0
                  default: 0
              required:
                - time
              type: object
            result:
              type: object
          required:
            - goal
          title: "延时"
          type: object
    type: python

  description: "GreenLab 6通道电反应仪，支持恒流/恒压输出、搅拌控制、实时监测"

  category:
    - electrochemical
    - reactor

  # 初始化参数
  init_param_schema:
    port:
      type: string
      description: "串口端口(Modbus RTU)，例如 'COM3' 或 '/dev/ttyUSB0'"
      required: true
    baudrate:
      type: integer
      description: "串口波特率"
      default: 115200
      enum: [2400, 4800, 9600, 19200, 57600, 115200]
    slave_id:
      type: integer
      description: "Modbus从站地址"
      default: 1
      minimum: 1
      maximum: 254
    timeout:
      type: integer
      description: "通信超时时间(秒)"
      default: 3
    rts_toggle:
      type: boolean
      description: "RS485半双工RTS方向控制（官方Modbus Poll默认开启）"
      default: true

  # 设备状态属性（会被自动发布为ROS2 Topic）
  status_types:
    status:
      type: string
      description: "设备连接状态"
    is_connected:
      type: boolean
      description: "是否已连接"

  # 设备动作映射（会被自动注册为ROS2 Action）
  action_value_mappings:
    # 输出模式控制
    set_output_mode:
      description: "设置输出模式(恒压/恒流)"
      parameters:
        mode:
          type: integer
          description: "输出模式 (0=恒压, 1=恒流)"
          enum: [0, 1]
      returns:
        type: boolean

    set_alternate_mode:
      description: "设置交替模式"
      parameters:
        mode:
          type: integer
          description: "交替模式 (0=无交替, 1=低频交替, 2=高频交替)"
          enum: [0, 1, 2]
        low_freq_time:
          type: integer
          description: "低频交替时间(秒)"
          default: 0
        high_freq_time:
          type: integer
          description: "高频交替时间(毫秒)"
          default: 0
      returns:
        type: boolean

    # 通道控制
    set_channel_switch:
      description: "设置通道开关"
      parameters:
        channel:
          type: integer
          description: "通道号(1-6)"
          minimum: 1
          maximum: 6
        enable:
          type: boolean
          description: "True=打开, False=关闭"
      returns:
        type: boolean

    set_channel_voltage:
      description: "设置通道电压(恒压模式)"
      parameters:
        channel:
          type: integer
          description: "通道号(1-6)"
          minimum: 1
          maximum: 6
        voltage:
          type: number
          description: "电压值(V)，范围0-30V"
          minimum: 0
          maximum: 30
      returns:
        type: boolean

    set_channel_current:
      description: "设置通道电流(恒流模式)"
      parameters:
        channel:
          type: integer
          description: "通道号(1-6)"
          minimum: 1
          maximum: 6
        current:
          type: number
          description: "电流值(mA)，范围0-100mA"
          minimum: 0
          maximum: 100
      returns:
        type: boolean

    get_channel_voltage:
      description: "读取通道当前电压"
      parameters:
        channel:
          type: integer
          description: "通道号(1-6)"
          minimum: 1
          maximum: 6
      returns:
        type: number
        description: "电压值(V)"

    get_channel_current:
      description: "读取通道当前电流"
      parameters:
        channel:
          type: integer
          description: "通道号(1-6)"
          minimum: 1
          maximum: 6
      returns:
        type: number
        description: "电流值(mA)"

    get_channel_fault_status:
      description: "读取通道故障状态"
      parameters:
        channel:
          type: integer
          description: "通道号(1-6)"
          minimum: 1
          maximum: 6
      returns:
        type: object

    reset_channel_fault:
      description: "复位通道故障状态"
      parameters:
        channel:
          type: integer
          description: "通道号(1-6)"
          minimum: 1
          maximum: 6
      returns:
        type: boolean

    # 搅拌控制
    set_stirrer:
      description: "设置搅拌电机"
      parameters:
        control:
          type: integer
          description: "搅拌控制 (0=关闭, 1=正转, 2=反转)"
          enum: [0, 1, 2]
        speed:
          type: integer
          description: "转速(rpm)，范围200-1000"
          default: 500
          minimum: 200
          maximum: 1000
      returns:
        type: boolean

    get_stirrer_speed:
      description: "读取当前搅拌转速"
      returns:
        type: integer
        description: "转速(rpm)"

    # 高级功能
    start_reaction:
      description: "启动电化学反应"
      parameters:
        channel:
          type: integer
          description: "通道号(1-6)"
          minimum: 1
          maximum: 6
        mode:
          type: integer
          description: "输出模式 (0=恒压, 1=恒流)"
          enum: [0, 1]
        voltage:
          type: number
          description: "电压值(V)"
          default: 0.0
        current:
          type: number
          description: "电流值(mA)"
          default: 0.0
        stirrer_speed:
          type: integer
          description: "搅拌转速(rpm)，0表示不启动搅拌"
          default: 0
      returns:
        type: object
        description: "包含操作结果的字典"

    stop_reaction:
      description: "停止电化学反应"
      parameters:
        channel:
          type: integer
          description: "通道号(1-6)"
          minimum: 1
          maximum: 6
        stop_stirrer:
          type: boolean
          description: "是否同时停止搅拌"
          default: true
      returns:
        type: object

    delay:
      description: "延时节点：工作流停留指定秒数后继续"
      parameters:
        time:
          type: number
          description: "延时时间(秒)"
          minimum: 0
          default: 0
      returns:
        type: object

    get_channel_status:
      description: "获取通道完整状态"
      parameters:
        channel:
          type: integer
          description: "通道号(1-6)"
          minimum: 1
          maximum: 6
      returns:
        type: object
        description: "包含通道状态的字典"

    get_all_channels_status:
      description: "获取所有通道状态"
      returns:
        type: array
        description: "包含所有通道状态的列表"

    emergency_stop:
      description: "紧急停止所有通道"
      returns:
        type: boolean

    disconnect:
      description: "断开设备连接"
      returns:
        type: null

  # 前端显示配置
  schema:
    properties:
      status:
        type: string
        title: "设备状态"
      is_connected:
        type: boolean
        title: "连接状态"

  # 设备图标（可选）
  icon: "⚡"

  # 标签
  tags:
    - electrochemical
    - modbus
    - multi-channel
    - stirrer
